<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FitMe — Exercise Logger</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script type="text/babel" src="android-frame.jsx"></script>
  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #080810; }
    body { display: flex; align-items: center; justify-content: center; font-family: 'DM Sans', sans-serif; }
    ::-webkit-scrollbar { width: 0; }
    input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; }
    input::placeholder { color: #3a3a4c; }
    * { -webkit-tap-highlight-color: transparent; }
    @keyframes fadeSlideUp { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:translateY(0); } }
    @keyframes pop { 0%{transform:scale(1)} 40%{transform:scale(1.12)} 100%{transform:scale(1)} }
    @keyframes checkIn { from{opacity:0;transform:scale(0.6)} to{opacity:1;transform:scale(1)} }
  </style>
</head>
<body>
<div id="root" style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;"></div>

<script type="text/babel">
const { useState, useEffect, useRef } = React;

// ── Tokens ─────────────────────────────────────────────────────────────────────
const T = {
  bg:       '#0d0d12',
  bgCard:   '#181820',
  bgRow:    '#1c1c28',
  bgInput:  '#222232',
  border:   '#2a2a3a',
  accent:   '#e8854a',
  green:    '#3dd68c',
  greenDim: 'rgba(61,214,140,0.12)',
  text:     '#f0ede8',
  textSub:  '#8a8898',
  textMuted:'#4a4a5c',
  danger:   '#ef4444',
};

// ── Exercises data ─────────────────────────────────────────────────────────────
const EXERCISES = [
  {
    id: 'bench', name: 'Bench Press',
    muscles: ['Chest','Triceps','Front Deltoid'],
    activeM: ['chest','triceps','front_delt'],
    equipment: 'Barbell', cat: 'STRENGTH',
    history: [
      { date: 'Apr 30', sets: [{w:100,r:8},{w:100,r:8},{w:105,r:6}] },
      { date: 'Apr 24', sets: [{w:97.5,r:8},{w:97.5,r:7},{w:100,r:6}] },
      { date: 'Apr 18', sets: [{w:95,r:8},{w:95,r:8},{w:95,r:7}] },
    ],
    lastWeight: 100, lastReps: 8,
  },
  {
    id: 'squat', name: 'Barbell Squat',
    muscles: ['Quadriceps','Glutes','Hamstrings'],
    activeM: ['quads','glutes','hamstrings'],
    equipment: 'Barbell', cat: 'STRENGTH',
    history: [
      { date: 'May 1',  sets: [{w:120,r:6},{w:120,r:6},{w:125,r:4}] },
      { date: 'Apr 25', sets: [{w:115,r:6},{w:115,r:5},{w:120,r:4}] },
    ],
    lastWeight: 120, lastReps: 6,
  },
  {
    id: 'pullup', name: 'Pull-ups',
    muscles: ['Lats','Biceps','Rear Deltoid'],
    activeM: ['lats','biceps','rear_delt'],
    equipment: 'Bodyweight', cat: 'STRENGTH',
    history: [
      { date: 'Apr 29', sets: [{w:0,r:10},{w:0,r:9},{w:0,r:8}] },
    ],
    lastWeight: 0, lastReps: 10,
  },
  {
    id: 'deadlift', name: 'Deadlift',
    muscles: ['Back','Glutes','Hamstrings'],
    activeM: ['lower_back','glutes','hamstrings'],
    equipment: 'Barbell', cat: 'STRENGTH',
    history: [
      { date: 'Apr 28', sets: [{w:150,r:5},{w:155,r:4},{w:160,r:3}] },
    ],
    lastWeight: 150, lastReps: 5,
  },
];

// ── Muscle colors ──────────────────────────────────────────────────────────────
const MC = {
  chest: '#e8694a', pec: '#e8694a',
  triceps: '#9b7fe8', tricep: '#9b7fe8',
  front_delt: '#9b7fe8', rear_delt: '#5aaee8',
  biceps: '#e8694a', bicep: '#e8694a',
  lats: '#5aaee8', lat: '#5aaee8',
  lower_back: '#5aaee8',
  quads: '#e8694a', quad: '#e8694a',
  glutes: '#9b7fe8', glute: '#9b7fe8',
  hamstrings: '#5aaee8', ham: '#5aaee8',
  calves: '#3dd68c', calf: '#3dd68c',
  core: '#e8c44a', abs: '#e8c44a',
};

// ── Exercise Preview SVG (front anatomical) ────────────────────────────────────
function ExercisePreview({ ex }) {
  const active = ex.activeM || [];
  const isA = (ids) => ids.some(id => active.some(a => a === id || a.startsWith(id.split('_')[0])));

  const skin  = '#2a2535';
  const skinS = '#3a3550';
  const base  = '#1e1e2c';
  const baseS = '#2a2a3a';

  function M({ ids, d, side = null }) {
    const on = isA(ids);
    const col = on ? (MC[ids[0]] || T.accent) : base;
    return (
      <path d={d} fill={col} stroke={on ? col : baseS} strokeWidth={on ? 0.4 : 0.6}
        opacity={on ? 0.9 : 0.3}
        style={{ transition: 'fill 0.3s, opacity 0.3s', filter: on ? `drop-shadow(0 0 4px ${col}90)` : 'none' }}
      />
    );
  }

  // Front view only — compact 96×180 canvas
  return (
    <svg viewBox="8 0 88 190" width="96" height="180" style={{ overflow: 'visible' }}>
      {/* Head */}
      <ellipse cx="52" cy="14" rx="11" ry="13" fill={skin} stroke={skinS} strokeWidth="0.8"/>
      {/* Neck */}
      <rect x="47" y="25" width="10" height="9" rx="3" fill={skin} stroke={skinS} strokeWidth="0.8"/>
      {/* Torso */}
      <path d="M30 34 C26 40 24 58 24 76 C24 90 26 100 30 106 L74 106 C78 100 80 90 80 76 C80 58 78 40 74 34 Z"
        fill={skin} stroke={skinS} strokeWidth="0.8"/>
      {/* Left arm */}
      <path d="M30 36 C24 40 18 52 16 66 C14 76 16 84 18 86 C22 84 24 78 26 68 C28 56 30 44 32 36 Z"
        fill={skin} stroke={skinS} strokeWidth="0.8"/>
      {/* Right arm */}
      <path d="M74 36 C80 40 86 52 88 66 C90 76 88 84 86 86 C82 84 80 78 78 68 C76 56 74 44 72 36 Z"
        fill={skin} stroke={skinS} strokeWidth="0.8"/>
      {/* Forearms */}
      <path d="M16 88 C14 96 14 106 16 112 C18 116 22 116 24 112 C26 106 26 96 24 88 Z" fill={skin} stroke={skinS} strokeWidth="0.8"/>
      <path d="M88 88 C90 96 90 106 88 112 C86 116 82 116 80 112 C78 106 78 96 80 88 Z" fill={skin} stroke={skinS} strokeWidth="0.8"/>
      {/* Legs */}
      <path d="M24 106 C20 120 18 140 20 158 C22 170 28 176 34 174 C40 172 42 162 42 150 C42 134 40 118 38 106 Z" fill={skin} stroke={skinS} strokeWidth="0.8"/>
      <path d="M80 106 C84 120 86 140 84 158 C82 170 76 176 70 174 C64 172 62 162 62 150 C62 134 64 118 66 106 Z" fill={skin} stroke={skinS} strokeWidth="0.8"/>
      {/* Calves */}
      <path d="M20 158 C18 168 20 178 22 184 C24 188 30 188 34 184 C38 180 38 170 36 160 Z" fill={skin} stroke={skinS} strokeWidth="0.8"/>
      <path d="M84 158 C86 168 84 178 82 184 C80 188 74 188 70 184 C66 180 66 170 68 160 Z" fill={skin} stroke={skinS} strokeWidth="0.8"/>

      {/* ── MUSCLES ── */}
      {/* Chest L */}
      <M ids={['chest','pec']} d="M32 38 C36 36 46 36 52 39 C52 48 48 54 40 54 C34 54 30 48 30 44 C30 40 30 38 32 38 Z"/>
      {/* Chest R */}
      <M ids={['chest','pec']} d="M72 38 C68 36 58 36 52 39 C52 48 56 54 64 54 C70 54 74 48 74 44 C74 40 74 38 72 38 Z"/>
      {/* Front delt L */}
      <M ids={['front_delt']} d="M26 34 C22 36 20 42 22 48 C24 52 28 52 30 48 C32 44 30 38 28 34 Z"/>
      {/* Front delt R */}
      <M ids={['front_delt']} d="M78 34 C82 36 84 42 82 48 C80 52 76 52 74 48 C72 44 74 38 76 34 Z"/>
      {/* Bicep L */}
      <M ids={['biceps','bicep']} d="M18 52 C14 58 14 66 18 72 C20 76 24 76 26 72 C28 66 28 58 24 52 Z"/>
      {/* Bicep R */}
      <M ids={['biceps','bicep']} d="M86 52 C90 58 90 66 86 72 C84 76 80 76 78 72 C76 66 76 58 80 52 Z"/>
      {/* Tricep L */}
      <M ids={['triceps','tricep']} d="M16 50 C12 54 12 62 16 68 C18 70 20 68 20 64 C20 58 18 52 16 50 Z"/>
      {/* Tricep R */}
      <M ids={['triceps','tricep']} d="M88 50 C92 54 92 62 88 68 C86 70 84 68 84 64 C84 58 86 52 88 50 Z"/>
      {/* Abs */}
      {[[44,58,12,9],[44,70,12,9],[44,82,12,9]].map(([x,y,w,h],i) => (
        <M key={i} ids={['core','abs']} d={`M${x} ${y} Q${x} ${y-2} ${x+3} ${y-2} L${x+w-3} ${y-2} Q${x+w} ${y-2} ${x+w} ${y} L${x+w} ${y+h} Q${x+w} ${y+h+2} ${x+w-3} ${y+h+2} L${x+3} ${y+h+2} Q${x} ${y+h+2} ${x} ${y+h} Z`}/>
      ))}
      {/* Obliques */}
      <M ids={['core']} d="M28 60 C24 68 24 80 28 88 C30 92 34 92 36 86 C38 78 36 66 32 60 Z"/>
      <M ids={['core']} d="M76 60 C80 68 80 80 76 88 C74 92 70 92 68 86 C66 78 68 66 72 60 Z"/>
      {/* Lats L */}
      <M ids={['lats','lat']} d="M28 52 C22 60 22 78 26 88 C30 94 36 92 38 84 C38 72 36 58 32 52 Z"/>
      {/* Lats R */}
      <M ids={['lats','lat']} d="M76 52 C82 60 82 78 78 88 C74 94 68 92 66 84 C66 72 68 58 72 52 Z"/>
      {/* Quads L */}
      <M ids={['quads','quad']} d="M24 108 C20 124 18 144 20 162 C22 170 28 172 34 168 C38 162 40 148 38 130 C36 116 32 108 28 108 Z"/>
      {/* Quads R */}
      <M ids={['quads','quad']} d="M80 108 C84 124 86 144 84 162 C82 170 76 172 70 168 C66 162 64 148 66 130 C68 116 72 108 76 108 Z"/>
      {/* Lower back / glutes (visible from front hip area) */}
      <M ids={['lower_back','glutes','glute']} d="M36 102 C32 108 32 116 36 120 C42 122 52 122 52 118 C52 112 46 104 40 102 Z"/>
      <M ids={['lower_back','glutes','glute']} d="M68 102 C72 108 72 116 68 120 C62 122 52 122 52 118 C52 112 58 104 64 102 Z"/>
      {/* Hamstrings (inner thigh visible from front) */}
      <M ids={['hamstrings','ham']} d="M28 116 C26 132 26 152 28 164 C30 168 34 166 36 160 C38 148 38 130 36 116 Z"/>
      <M ids={['hamstrings','ham']} d="M76 116 C78 132 78 152 76 164 C74 168 70 166 68 160 C66 148 66 130 68 116 Z"/>
      {/* Calves */}
      <M ids={['calves','calf']} d="M20 160 C18 170 18 180 22 186 C24 188 28 188 32 184 C34 180 36 170 34 160 Z"/>
      <M ids={['calves','calf']} d="M84 160 C86 170 86 180 82 186 C80 188 76 188 72 184 C70 180 68 170 70 160 Z"/>
    </svg>
  );
}

// ── Set Row ────────────────────────────────────────────────────────────────────
function SetRow({ set, index, onUpdate, onRemove, isNew, prevWeight, prevReps }) {
  const isDone = set.done;

  return (
    <div style={{
      display: 'flex', alignItems: 'center', gap: 8,
      padding: '0 16px', height: 54,
      background: isDone ? 'rgba(61,214,140,0.06)' : T.bgRow,
      borderRadius: 14, marginBottom: 6,
      border: `1px solid ${isDone ? 'rgba(61,214,140,0.2)' : T.border}`,
      transition: 'background 0.2s, border-color 0.2s',
      animation: isNew ? 'fadeSlideUp 0.2s ease both' : 'none',
    }}>
      {/* Set number */}
      <span style={{ fontFamily: "'Barlow Condensed'", fontSize: 13, fontWeight: 700, color: T.textMuted, width: 18, textAlign: 'center', flexShrink: 0 }}>
        {index + 1}
      </span>

      {/* Weight field */}
      <div style={{ flex: 1, display: 'flex', alignItems: 'baseline', gap: 4 }}>
        <input
          type="number" step="2.5" min="0"
          value={set.weight ?? ''}
          placeholder={prevWeight != null ? `(${prevWeight})` : '0'}
          onChange={e => onUpdate({ ...set, weight: e.target.value === '' ? null : +e.target.value, done: false })}
          style={{
            background: 'none', border: 'none', outline: 'none',
            fontFamily: "'Barlow Condensed'", fontSize: 22, fontWeight: 800,
            color: set.weight != null ? T.text : T.textMuted,
            width: 64, textAlign: 'left',
          }}
        />
        <span style={{ fontFamily: "'DM Sans'", fontSize: 12, color: T.textMuted, paddingBottom: 1 }}>кг</span>
      </div>

      {/* Divider */}
      <div style={{ width: 1, height: 28, background: T.border, flexShrink: 0 }} />

      {/* Reps field */}
      <div style={{ flex: 1, display: 'flex', alignItems: 'baseline', gap: 4, paddingLeft: 12 }}>
        <input
          type="number" min="0"
          value={set.reps ?? ''}
          placeholder={prevReps != null ? `(${prevReps})` : '0'}
          onChange={e => onUpdate({ ...set, reps: e.target.value === '' ? null : +e.target.value, done: false })}
          style={{
            background: 'none', border: 'none', outline: 'none',
            fontFamily: "'Barlow Condensed'", fontSize: 22, fontWeight: 800,
            color: set.reps != null ? T.text : T.textMuted,
            width: 48, textAlign: 'left',
          }}
        />
        <span style={{ fontFamily: "'DM Sans'", fontSize: 12, color: T.textMuted, paddingBottom: 1 }}>раз</span>
      </div>

      {/* Done / Remove button */}
      {isDone ? (
        <button
          onClick={() => onRemove()}
          style={{
            width: 34, height: 34, borderRadius: '50%', border: 'none', flexShrink: 0,
            background: 'rgba(61,214,140,0.15)', color: T.green,
            display: 'flex', alignItems: 'center', justifyContent: 'center', cursor: 'pointer',
            animation: 'checkIn 0.2s ease',
          }}
        >
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
            <polyline points="20 6 9 17 4 12"/>
          </svg>
        </button>
      ) : (
        <button
          onClick={() => {
            if (set.weight != null || set.reps != null) {
              onUpdate({ ...set, done: true });
            } else {
              onRemove();
            }
          }}
          style={{
            width: 34, height: 34, borderRadius: '50%', border: 'none', flexShrink: 0,
            background: T.bgInput, color: T.textMuted,
            display: 'flex', alignItems: 'center', justifyContent: 'center', cursor: 'pointer',
            fontSize: 18, lineHeight: 1,
          }}
        >—</button>
      )}
    </div>
  );
}

// ── History Panel ──────────────────────────────────────────────────────────────
function HistoryPanel({ ex, onClose }) {
  return (
    <div style={{
      position: 'absolute', inset: 0, background: T.bg, zIndex: 10,
      display: 'flex', flexDirection: 'column',
      animation: 'fadeSlideUp 0.2s ease',
    }}>
      <div style={{ padding: '16px 20px 12px', borderBottom: `1px solid ${T.border}`, display: 'flex', alignItems: 'center', gap: 12 }}>
        <button onClick={onClose} style={{ background: T.bgRow, border: 'none', color: T.textSub, width: 32, height: 32, borderRadius: 9, cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><polyline points="15 18 9 12 15 6"/></svg>
        </button>
        <div>
          <p style={{ fontFamily: "'Barlow Condensed'", fontSize: 11, fontWeight: 700, letterSpacing: '0.1em', textTransform: 'uppercase', color: T.textMuted }}>История</p>
          <p style={{ fontFamily: "'Barlow Condensed'", fontSize: 18, fontWeight: 800, color: T.text, textTransform: 'uppercase', letterSpacing: '0.02em' }}>{ex.name}</p>
        </div>
      </div>

      <div style={{ flex: 1, overflowY: 'auto', padding: '14px 20px' }}>
        {ex.history.map((session, i) => {
          const vol = session.sets.reduce((acc, s) => acc + (s.w || 0) * (s.r || 0), 0);
          return (
            <div key={i} style={{ marginBottom: 16, background: T.bgCard, borderRadius: 14, border: `1px solid ${T.border}`, overflow: 'hidden' }}>
              <div style={{ padding: '10px 14px 8px', borderBottom: `1px solid ${T.border}`, display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
                <span style={{ fontFamily: "'DM Sans'", fontSize: 13, fontWeight: 600, color: T.text }}>{session.date}</span>
                <span style={{ fontFamily: "'Barlow Condensed'", fontSize: 12, fontWeight: 700, color: T.textMuted, textTransform: 'uppercase', letterSpacing: '0.06em' }}>
                  {vol > 0 ? `${vol} кг объём` : `${session.sets.length} подхода`}
                </span>
              </div>
              {session.sets.map((s, j) => (
                <div key={j} style={{
                  display: 'flex', alignItems: 'center', padding: '9px 14px',
                  borderBottom: j < session.sets.length - 1 ? `1px solid ${T.border}` : 'none',
                }}>
                  <span style={{ fontFamily: "'Barlow Condensed'", fontSize: 12, fontWeight: 700, color: T.textMuted, width: 22 }}>{j+1}</span>
                  <span style={{ fontFamily: "'Barlow Condensed'", fontSize: 19, fontWeight: 800, color: T.text, flex: 1 }}>
                    {s.w > 0 ? `${s.w} кг` : 'BW'}
                  </span>
                  <div style={{ width: 1, height: 20, background: T.border, margin: '0 12px' }} />
                  <span style={{ fontFamily: "'Barlow Condensed'", fontSize: 19, fontWeight: 800, color: T.text }}>{s.r} раз</span>
                </div>
              ))}
            </div>
          );
        })}
        {ex.history.length === 0 && (
          <div style={{ textAlign: 'center', paddingTop: 60 }}>
            <p style={{ fontFamily: "'Barlow Condensed'", fontSize: 18, fontWeight: 800, textTransform: 'uppercase', color: T.textSub }}>Нет истории</p>
            <p style={{ fontFamily: "'DM Sans'", fontSize: 13, color: T.textMuted, marginTop: 6 }}>Это будет ваш первый подход</p>
          </div>
        )}
      </div>
    </div>
  );
}

// ── Note Modal ─────────────────────────────────────────────────────────────────
function NoteModal({ value, onChange, onClose }) {
  return (
    <div style={{ position: 'absolute', inset: 0, background: 'rgba(0,0,0,0.6)', zIndex: 20, display: 'flex', alignItems: 'flex-end' }}
      onClick={onClose}
    >
      <div onClick={e => e.stopPropagation()} style={{
        width: '100%', background: T.bgCard, borderRadius: '18px 18px 0 0',
        border: `1px solid ${T.border}`, padding: '14px 18px 28px',
        animation: 'fadeSlideUp 0.2s ease',
      }}>
        <div style={{ display: 'flex', justifyContent: 'center', marginBottom: 12 }}>
          <div style={{ width: 36, height: 4, borderRadius: 2, background: T.border }} />
        </div>
        <p style={{ fontFamily: "'Barlow Condensed'", fontSize: 12, fontWeight: 700, letterSpacing: '0.1em', textTransform: 'uppercase', color: T.textMuted, marginBottom: 10 }}>Заметка</p>
        <textarea
          value={value}
          onChange={e => onChange(e.target.value)}
          placeholder="Добавьте заметку к этому упражнению…"
          autoFocus
          rows={3}
          style={{
            width: '100%', background: T.bgInput, border: `1.5px solid ${T.border}`,
            borderRadius: 10, padding: '10px 12px', color: T.text,
            fontFamily: "'DM Sans'", fontSize: 14, outline: 'none', resize: 'none',
          }}
        />
        <button onClick={onClose} style={{
          width: '100%', marginTop: 10, padding: '12px', borderRadius: 12,
          background: T.accent, border: 'none', color: '#0d0d12',
          fontFamily: "'Barlow Condensed'", fontSize: 15, fontWeight: 800,
          letterSpacing: '0.06em', textTransform: 'uppercase', cursor: 'pointer',
        }}>Сохранить</button>
      </div>
    </div>
  );
}

// ── Exercise Logger Screen ─────────────────────────────────────────────────────
function ExerciseLoggerScreen({ compact }) {
  const [exIdx, setExIdx] = useState(0);
  const ex = EXERCISES[exIdx];

  const initSets = () => [
    { id: 1, weight: ex.lastWeight, reps: ex.lastReps, done: true },
    { id: 2, weight: ex.lastWeight, reps: ex.lastReps, done: true },
    { id: 3, weight: null, reps: null, done: false },
  ];

  const [sets, setSets] = useState(initSets);
  const [note, setNote] = useState('');
  const [showNote, setShowNote] = useState(false);
  const [showHistory, setShowHistory] = useState(false);
  const nextId = useRef(10);

  // Reset when switching exercises
  useEffect(() => {
    setSets(initSets());
    setNote('');
  }, [exIdx]);

  function updateSet(idx, updated) {
    setSets(s => s.map((row, i) => i === idx ? { ...row, ...updated } : row));
  }

  function removeSet(idx) {
    setSets(s => s.filter((_, i) => i !== idx));
  }

  function addSet() {
    const lastDone = [...sets].reverse().find(s => s.weight != null || s.reps != null);
    setSets(s => [...s, {
      id: nextId.current++,
      weight: lastDone?.weight ?? ex.lastWeight,
      reps: lastDone?.reps ?? ex.lastReps,
      done: false,
    }]);
  }

  const doneSets = sets.filter(s => s.done);
  const totalVol = doneSets.reduce((a, s) => a + (s.weight || 0) * (s.reps || 0), 0);

  return (
    <div style={{ flex: 1, overflow: 'hidden', display: 'flex', flexDirection: 'column', position: 'relative', background: T.bg }}>

      {/* ── Top nav ── */}
      <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: compact ? '12px 16px 8px' : '16px 20px 10px', flexShrink: 0 }}>
        <button style={{ background: T.bgRow, border: 'none', color: T.textSub, width: 32, height: 32, borderRadius: 9, cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><polyline points="15 18 9 12 15 6"/></svg>
        </button>

        {/* Exercise switcher pills */}
        <div style={{ display: 'flex', gap: 5, overflowX: 'auto', maxWidth: 230 }}>
          {EXERCISES.map((e, i) => (
            <button key={e.id} onClick={() => setExIdx(i)} style={{
              flexShrink: 0, width: 8, height: 8, borderRadius: '50%', border: 'none', padding: 0,
              background: i === exIdx ? T.accent : T.border, cursor: 'pointer',
              transition: 'background 0.15s, transform 0.15s',
              transform: i === exIdx ? 'scale(1.3)' : 'scale(1)',
            }} />
          ))}
        </div>

        <button style={{ background: T.bgRow, border: 'none', color: T.textSub, width: 32, height: 32, borderRadius: 9, cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
            <circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/>
          </svg>
        </button>
      </div>

      {/* ── Preview card ── */}
      <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', paddingBottom: compact ? 12 : 16, flexShrink: 0 }}>
        {/* Image area */}
        <div style={{
          width: compact ? 130 : 150, height: compact ? 130 : 150,
          borderRadius: 24, background: T.bgCard,
          border: `1.5px solid ${T.border}`,
          display: 'flex', alignItems: 'center', justifyContent: 'center',
          position: 'relative', overflow: 'hidden',
          boxShadow: '0 8px 32px rgba(0,0,0,0.4)',
        }}>
          <ExercisePreview ex={ex} />
          {/* Video badge */}
          <div style={{
            position: 'absolute', bottom: 10,
            background: 'rgba(13,13,18,0.85)',
            backdropFilter: 'blur(8px)',
            borderRadius: 20, padding: '5px 12px',
            display: 'flex', alignItems: 'center', gap: 6,
            border: '1px solid rgba(255,255,255,0.08)',
          }}>
            <div style={{ width: 0, height: 0, borderStyle: 'solid', borderWidth: '5px 0 5px 8px', borderColor: `transparent transparent transparent ${T.green}` }} />
            <span style={{ fontFamily: "'Barlow Condensed'", fontSize: 11, fontWeight: 700, letterSpacing: '0.1em', textTransform: 'uppercase', color: T.text }}>Видео</span>
          </div>
        </div>

        {/* Exercise name */}
        <h1 style={{
          fontFamily: "'DM Sans'", fontSize: compact ? 18 : 21, fontWeight: 600,
          color: T.text, textAlign: 'center', marginTop: compact ? 10 : 14,
          padding: '0 24px', lineHeight: 1.2,
        }}>{ex.name}</h1>

        {/* Muscle tags */}
        <div style={{ display: 'flex', gap: 5, marginTop: 6, flexWrap: 'wrap', justifyContent: 'center', padding: '0 24px' }}>
          {ex.muscles.map(m => (
            <span key={m} style={{
              fontSize: 10, fontFamily: "'DM Sans'", color: T.textSub,
              background: T.bgRow, borderRadius: 6, padding: '2px 8px',
              border: `1px solid ${T.border}`,
            }}>{m}</span>
          ))}
        </div>
      </div>

      {/* ── Sets ── */}
      <div style={{ flex: 1, overflowY: 'auto', padding: compact ? '0 14px' : '0 16px' }}>
        {sets.map((set, i) => (
          <SetRow
            key={set.id}
            set={set}
            index={i}
            onUpdate={updated => updateSet(i, updated)}
            onRemove={() => removeSet(i)}
            isNew={i === sets.length - 1 && !set.done && sets.length > 3}
            prevWeight={i > 0 ? (sets[i-1].weight ?? ex.lastWeight) : ex.lastWeight}
            prevReps={i > 0 ? (sets[i-1].reps ?? ex.lastReps) : ex.lastReps}
          />
        ))}

        {/* Action row */}
        <div style={{ display: 'flex', borderTop: `1px solid ${T.border}`, marginTop: 4 }}>
          <button onClick={() => setShowNote(true)} style={{
            flex: 1, padding: compact ? '12px 0' : '14px 0',
            background: 'none', border: 'none', borderRight: `1px solid ${T.border}`,
            color: T.textSub, fontFamily: "'DM Sans'", fontSize: 13, fontWeight: 500,
            cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 6,
          }}>
            <span style={{ fontSize: 14 }}>+</span> Заметка
          </button>
          <button onClick={addSet} style={{
            flex: 1, padding: compact ? '12px 0' : '14px 0',
            background: 'none', border: 'none',
            color: T.textSub, fontFamily: "'DM Sans'", fontSize: 13, fontWeight: 500,
            cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 6,
          }}>
            <span style={{ fontSize: 14 }}>+</span> Ещё подход
          </button>
        </div>

        {/* History link */}
        <button onClick={() => setShowHistory(true)} style={{
          width: '100%', marginTop: 8,
          padding: compact ? '12px 16px' : '14px 16px',
          background: T.bgCard, border: `1px solid ${T.border}`,
          borderRadius: 14, cursor: 'pointer',
          display: 'flex', alignItems: 'center', gap: 10,
        }}>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke={T.textSub} strokeWidth="1.8" strokeLinecap="round">
            <rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>
          </svg>
          <span style={{ fontFamily: "'DM Sans'", fontSize: 13, fontWeight: 500, color: T.textSub, flex: 1, textAlign: 'left' }}>
            История выполнений
          </span>
          {ex.history.length > 0 && (
            <span style={{ fontFamily: "'Barlow Condensed'", fontSize: 12, fontWeight: 700, color: T.textMuted, marginRight: 4 }}>
              {ex.history.length} сессии
            </span>
          )}
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke={T.textMuted} strokeWidth="2" strokeLinecap="round"><polyline points="9 18 15 12 9 6"/></svg>
        </button>

        {/* Volume summary (if any done sets) */}
        {doneSets.length > 0 && (
          <div style={{ margin: '10px 0 16px', padding: '10px 14px', background: T.accentDim || 'rgba(232,133,74,0.08)', borderRadius: 12, border: `1px solid rgba(232,133,74,0.15)`, display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
            <span style={{ fontFamily: "'DM Sans'", fontSize: 12, color: T.textSub }}>{doneSets.length} подход{doneSets.length > 1 ? 'а' : ''} выполнено</span>
            {totalVol > 0 && <span style={{ fontFamily: "'Barlow Condensed'", fontSize: 16, fontWeight: 800, color: T.accent }}>{totalVol} кг</span>}
          </div>
        )}
      </div>

      {/* Overlays */}
      {showHistory && <HistoryPanel ex={ex} onClose={() => setShowHistory(false)} />}
      {showNote && <NoteModal value={note} onChange={setNote} onClose={() => setShowNote(false)} />}
    </div>
  );
}

// ── Scaled Device ──────────────────────────────────────────────────────────────
function ScaledDevice({ children }) {
  const [scale, setScale] = useState(1);
  useEffect(() => {
    function compute() {
      setScale(Math.min((window.innerWidth - 32) / 406, (window.innerHeight - 32) / 860, 1));
    }
    compute();
    window.addEventListener('resize', compute);
    return () => window.removeEventListener('resize', compute);
  }, []);
  return <div style={{ transform: `scale(${scale})`, transformOrigin: 'center center' }}>{children}</div>;
}

// ── App ────────────────────────────────────────────────────────────────────────
function App() {
  const [tweaks, setTweak] = useTweaks(/*EDITMODE-BEGIN*/{
    "density": "comfortable"
  }/*EDITMODE-END*/);
  const compact = tweaks.density === 'compact';

  return (
    <>
      <style>{`
        @keyframes fadeSlideUp { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:translateY(0)} }
        @keyframes checkIn { from{opacity:0;transform:scale(0.6)} to{opacity:1;transform:scale(1)} }
        input::placeholder { color: #3a3a4c; }
        ::-webkit-scrollbar { width: 0; }
        * { -webkit-tap-highlight-color: transparent; }
        input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; }
        textarea::placeholder { color: #3a3a4c; }
        textarea { font-family: 'DM Sans', sans-serif; }
      `}</style>

      <ScaledDevice>
        <AndroidDevice dark={true} width={390} height={844}>
          <div style={{ width: '100%', height: '100%', display: 'flex', flexDirection: 'column', background: T.bg }}>
            <ExerciseLoggerScreen compact={compact} />
            {/* Tab bar stub */}
            <div style={{ height: 64, background: T.bgCard, borderTop: `1px solid ${T.border}`, display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0 }}>
              <span style={{ fontFamily: "'Barlow Condensed'", fontSize: 11, fontWeight: 700, letterSpacing: '0.1em', textTransform: 'uppercase', color: T.accent }}>Workouts</span>
            </div>
          </div>
        </AndroidDevice>
      </ScaledDevice>

      <TweaksPanel>
        <TweakSection label="Density">
          <TweakRadio label="Density" value={tweaks.density} options={['compact','comfortable']} onChange={v => setTweak('density', v)} />
        </TweakSection>
      </TweaksPanel>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
