<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FitMe — Auth Screens</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700;800;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script type="text/babel" src="android-frame.jsx"></script>
  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; }
    body {
      background: #111118;
      font-family: 'DM Sans', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .stage {
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    /* Scale device frame to always fit the viewport */
    #device-scaler {
      transform-origin: center center;
    }
  </style>
</head>
<body>
<div class="stage" id="root"></div>

<script type="text/babel">
const { useState, useEffect, useRef } = React;

// ── Design Tokens ──────────────────────────────────────────────────────────────
const T = {
  bg:       '#0d0d12',
  bgCard:   '#16161f',
  bgInput:  '#1e1e2a',
  border:   '#2a2a38',
  accent:   'oklch(0.72 0.18 35)',   // warm amber-orange
  accentDim:'oklch(0.72 0.18 35 / 0.15)',
  accentMid:'oklch(0.72 0.18 35 / 0.35)',
  textPrimary: '#f0ede8',
  textSub:  '#8a8898',
  textMuted:'#4a4a5c',
  danger:   '#ef4444',
  success:  '#22c55e',
};

// ── Icon Primitives ────────────────────────────────────────────────────────────
function IconEye({ off, size = 18 }) {
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round">
      {off ? <>
        <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
        <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
        <line x1="1" y1="1" x2="23" y2="23"/>
      </> : <>
        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
        <circle cx="12" cy="12" r="3"/>
      </>}
    </svg>
  );
}

function IconChevronLeft({ size = 20 }) {
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
      <polyline points="15 18 9 12 15 6"/>
    </svg>
  );
}

function IconCheck({ size = 16 }) {
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
      <polyline points="20 6 9 17 4 12"/>
    </svg>
  );
}

function IconCamera({ size = 22 }) {
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round">
      <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
      <circle cx="12" cy="13" r="4"/>
    </svg>
  );
}

function IconBolt({ size = 20 }) {
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill="currentColor">
      <path d="M13 2L4.09 12.69A1 1 0 0 0 5 14h6v8l8.91-10.69A1 1 0 0 0 19 10h-6V2z"/>
    </svg>
  );
}

// ── Shared UI Components ───────────────────────────────────────────────────────
function FInput({ label, type = 'text', placeholder, value, onChange, error, compact }) {
  const [show, setShow] = useState(false);
  const isPass = type === 'password';
  const py = compact ? '10px' : '14px';
  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 6 }}>
      {label && (
        <label style={{ fontFamily: "'Barlow Condensed'", fontSize: compact ? 11 : 12, fontWeight: 600, letterSpacing: '0.1em', textTransform: 'uppercase', color: T.textSub }}>
          {label}
        </label>
      )}
      <div style={{ position: 'relative' }}>
        <input
          type={isPass && !show ? 'password' : 'text'}
          placeholder={placeholder}
          value={value}
          onChange={e => onChange(e.target.value)}
          style={{
            width: '100%',
            background: T.bgInput,
            border: `1.5px solid ${error ? T.danger : T.border}`,
            borderRadius: 10,
            padding: `${py} 44px ${py} 14px`,
            color: T.textPrimary,
            fontFamily: "'DM Sans'",
            fontSize: compact ? 13 : 15,
            outline: 'none',
            transition: 'border-color 0.15s',
          }}
          onFocus={e => { e.target.style.borderColor = T.accent; }}
          onBlur={e => { e.target.style.borderColor = error ? T.danger : T.border; }}
        />
        {isPass && (
          <button
            type="button"
            onClick={() => setShow(s => !s)}
            style={{ position: 'absolute', right: 12, top: '50%', transform: 'translateY(-50%)', background: 'none', border: 'none', cursor: 'pointer', color: T.textSub, display: 'flex', alignItems: 'center' }}
          >
            <IconEye off={show} size={compact ? 16 : 18} />
          </button>
        )}
      </div>
      {error && <p style={{ fontSize: 11, color: T.danger, fontFamily: "'DM Sans'" }}>{error}</p>}
    </div>
  );
}

function FButton({ children, onClick, variant = 'primary', compact, disabled, loading }) {
  const py = compact ? 11 : 15;
  const isPrimary = variant === 'primary';
  const isGhost = variant === 'ghost';
  return (
    <button
      onClick={onClick}
      disabled={disabled || loading}
      style={{
        width: '100%',
        padding: `${py}px 20px`,
        borderRadius: 12,
        border: isGhost ? `1.5px solid ${T.border}` : 'none',
        background: isPrimary ? T.accent : isGhost ? 'transparent' : T.bgInput,
        color: isPrimary ? '#0d0d12' : T.textPrimary,
        fontFamily: "'Barlow Condensed'",
        fontSize: compact ? 15 : 17,
        fontWeight: 700,
        letterSpacing: '0.06em',
        textTransform: 'uppercase',
        cursor: disabled ? 'not-allowed' : 'pointer',
        opacity: disabled ? 0.45 : 1,
        transition: 'opacity 0.15s, transform 0.1s',
        display: 'flex',
        alignItems: 'center',
        justifyContent: 'center',
        gap: 8,
      }}
      onMouseDown={e => { if (!disabled) e.currentTarget.style.transform = 'scale(0.98)'; }}
      onMouseUp={e => { e.currentTarget.style.transform = 'scale(1)'; }}
    >
      {loading ? <Spinner /> : children}
    </button>
  );
}

function Spinner() {
  return (
    <div style={{
      width: 16, height: 16,
      border: '2px solid rgba(0,0,0,0.2)',
      borderTopColor: '#0d0d12',
      borderRadius: '50%',
      animation: 'spin 0.7s linear infinite',
    }} />
  );
}

function Divider({ label }) {
  return (
    <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
      <div style={{ flex: 1, height: 1, background: T.border }} />
      <span style={{ fontSize: 11, color: T.textMuted, fontFamily: "'DM Sans'", letterSpacing: '0.05em' }}>{label}</span>
      <div style={{ flex: 1, height: 1, background: T.border }} />
    </div>
  );
}

function GoogleBtn({ compact }) {
  return (
    <button style={{
      width: '100%', display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 10,
      padding: compact ? '10px 0' : '13px 0',
      background: T.bgInput, border: `1.5px solid ${T.border}`, borderRadius: 10,
      color: T.textPrimary, fontSize: compact ? 13 : 14, fontFamily: "'DM Sans'", fontWeight: 500,
      cursor: 'pointer', transition: 'border-color 0.15s',
    }}
    onMouseEnter={e => e.currentTarget.style.borderColor = '#5a5a6a'}
    onMouseLeave={e => e.currentTarget.style.borderColor = T.border}
    >
      <svg width={compact ? 17 : 19} height={compact ? 17 : 19} viewBox="0 0 24 24">
        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/>
        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
      </svg>
      Continue with Google
    </button>
  );
}

// ── Logo ───────────────────────────────────────────────────────────────────────
function Logo({ size = 'lg' }) {
  const isLg = size === 'lg';
  return (
    <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: isLg ? 6 : 4 }}>
      <div style={{
        width: isLg ? 52 : 38, height: isLg ? 52 : 38,
        borderRadius: isLg ? 14 : 10,
        background: T.accent,
        display: 'flex', alignItems: 'center', justifyContent: 'center',
        color: '#0d0d12',
      }}>
        <IconBolt size={isLg ? 26 : 18} />
      </div>
      <span style={{
        fontFamily: "'Barlow Condensed'",
        fontSize: isLg ? 26 : 18,
        fontWeight: 800,
        letterSpacing: '0.08em',
        textTransform: 'uppercase',
        color: T.textPrimary,
      }}>
        FitMe
      </span>
    </div>
  );
}

// ── SCREEN 1: Login ────────────────────────────────────────────────────────────
function LoginScreen({ onNavigate, compact }) {
  const [email, setEmail] = useState('');
  const [password, setPassword] = useState('');
  const [loading, setLoading] = useState(false);
  const [errors, setErrors] = useState({});

  function validate() {
    const e = {};
    if (!email.includes('@')) e.email = 'Enter a valid email';
    if (password.length < 6) e.password = 'At least 6 characters';
    setErrors(e);
    return Object.keys(e).length === 0;
  }

  function handleLogin() {
    if (!validate()) return;
    setLoading(true);
    setTimeout(() => { setLoading(false); onNavigate('user-info'); }, 1200);
  }

  const gap = compact ? 14 : 20;

  return (
    <div style={{ height: '100%', background: T.bg, display: 'flex', flexDirection: 'column', padding: compact ? '24px 20px 20px' : '36px 24px 28px', overflowY: 'auto' }}>
      {/* Hero */}
      <div style={{ flex: 1, display: 'flex', flexDirection: 'column', justifyContent: 'center', gap: compact ? 28 : 40 }}>
        <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: compact ? 20 : 28 }}>
          <Logo size={compact ? 'sm' : 'lg'} />
          <div style={{ textAlign: 'center' }}>
            <h1 style={{
              fontFamily: "'Barlow Condensed'", fontSize: compact ? 32 : 40, fontWeight: 900,
              letterSpacing: '-0.01em', textTransform: 'uppercase',
              color: T.textPrimary, lineHeight: 1.05,
            }}>
              Welcome back
            </h1>
            <p style={{ fontFamily: "'DM Sans'", fontSize: compact ? 13 : 14, color: T.textSub, marginTop: 6 }}>
              Log in to continue your streak
            </p>
          </div>
        </div>

        {/* Form */}
        <div style={{ display: 'flex', flexDirection: 'column', gap: gap }}>
          <FInput label="Email" placeholder="you@example.com" value={email} onChange={setEmail} error={errors.email} compact={compact} />
          <FInput label="Password" type="password" placeholder="••••••••" value={password} onChange={setPassword} error={errors.password} compact={compact} />

          <div style={{ textAlign: 'right', marginTop: -8 }}>
            <button style={{ background: 'none', border: 'none', color: T.accent, fontSize: compact ? 12 : 13, fontFamily: "'DM Sans'", cursor: 'pointer', fontWeight: 500 }}>
              Forgot password?
            </button>
          </div>

          <FButton onClick={handleLogin} loading={loading} compact={compact}>
            Log In
          </FButton>

          <Divider label="or continue with" />

          <GoogleBtn compact={compact} />
        </div>
      </div>

      {/* Footer */}
      <div style={{ textAlign: 'center', paddingTop: 16 }}>
        <span style={{ fontFamily: "'DM Sans'", fontSize: compact ? 12 : 13, color: T.textSub }}>
          Don't have an account?{' '}
          <button
            onClick={() => onNavigate('register')}
            style={{ background: 'none', border: 'none', color: T.accent, fontWeight: 600, cursor: 'pointer', fontSize: 'inherit' }}
          >
            Sign up
          </button>
        </span>
      </div>
    </div>
  );
}

// ── SCREEN 2: Register ─────────────────────────────────────────────────────────
function RegisterScreen({ onNavigate, compact }) {
  const [name, setName] = useState('');
  const [email, setEmail] = useState('');
  const [password, setPassword] = useState('');
  const [loading, setLoading] = useState(false);
  const [errors, setErrors] = useState({});
  const [step, setStep] = useState(1); // 2-step register flow

  function validateStep1() {
    const e = {};
    if (!name.trim()) e.name = 'Name is required';
    if (!email.includes('@')) e.email = 'Enter a valid email';
    setErrors(e);
    return Object.keys(e).length === 0;
  }

  function validateStep2() {
    const e = {};
    if (password.length < 8) e.password = 'At least 8 characters required';
    setErrors(e);
    return Object.keys(e).length === 0;
  }

  function handleNext() {
    if (step === 1 && validateStep1()) setStep(2);
    else if (step === 2 && validateStep2()) {
      setLoading(true);
      setTimeout(() => { setLoading(false); onNavigate('user-info'); }, 1200);
    }
  }

  const pwStrength = password.length === 0 ? 0 : password.length < 8 ? 1 : password.length < 12 ? 2 : 3;
  const strengthColors = ['transparent', '#ef4444', '#f97316', '#22c55e'];
  const strengthLabels = ['', 'Weak', 'Good', 'Strong'];
  const gap = compact ? 14 : 20;

  return (
    <div style={{ height: '100%', background: T.bg, display: 'flex', flexDirection: 'column', padding: compact ? '20px 20px 20px' : '28px 24px 28px', overflowY: 'auto' }}>
      {/* Back */}
      <button
        onClick={() => step === 1 ? onNavigate('login') : setStep(1)}
        style={{ background: 'none', border: 'none', color: T.textSub, cursor: 'pointer', display: 'flex', alignItems: 'center', gap: 4, width: 'fit-content', marginBottom: compact ? 16 : 20, padding: 0 }}
      >
        <IconChevronLeft size={18} />
        <span style={{ fontFamily: "'DM Sans'", fontSize: 13 }}>Back</span>
      </button>

      <div style={{ flex: 1, display: 'flex', flexDirection: 'column', gap: compact ? 24 : 32 }}>
        {/* Header */}
        <div>
          {/* Step indicator */}
          <div style={{ display: 'flex', gap: 6, marginBottom: compact ? 14 : 18 }}>
            {[1,2].map(s => (
              <div key={s} style={{
                height: 3, flex: 1, borderRadius: 2,
                background: s <= step ? T.accent : T.border,
                transition: 'background 0.3s',
              }} />
            ))}
          </div>

          <p style={{ fontFamily: "'DM Sans'", fontSize: compact ? 11 : 12, color: T.textSub, letterSpacing: '0.08em', textTransform: 'uppercase', marginBottom: 4 }}>
            Step {step} of 2
          </p>
          <h1 style={{
            fontFamily: "'Barlow Condensed'", fontSize: compact ? 30 : 38, fontWeight: 900,
            textTransform: 'uppercase', letterSpacing: '-0.01em',
            color: T.textPrimary, lineHeight: 1.05,
          }}>
            {step === 1 ? 'Create Account' : 'Set Password'}
          </h1>
          <p style={{ fontFamily: "'DM Sans'", fontSize: compact ? 12 : 13, color: T.textSub, marginTop: 5 }}>
            {step === 1 ? 'Start your fitness journey today' : 'Choose a strong password to protect your account'}
          </p>
        </div>

        {/* Fields */}
        <div style={{ display: 'flex', flexDirection: 'column', gap: gap }}>
          {step === 1 ? <>
            <FInput label="Full Name" placeholder="Alex Johnson" value={name} onChange={setName} error={errors.name} compact={compact} />
            <FInput label="Email" placeholder="you@example.com" value={email} onChange={setEmail} error={errors.email} compact={compact} />
          </> : <>
            <FInput label="Password" type="password" placeholder="Min. 8 characters" value={password} onChange={setPassword} error={errors.password} compact={compact} />

            {/* Strength meter */}
            {password.length > 0 && (
              <div style={{ display: 'flex', flexDirection: 'column', gap: 6 }}>
                <div style={{ display: 'flex', gap: 5 }}>
                  {[1,2,3].map(i => (
                    <div key={i} style={{
                      flex: 1, height: 3, borderRadius: 2,
                      background: i <= pwStrength ? strengthColors[pwStrength] : T.border,
                      transition: 'background 0.2s',
                    }} />
                  ))}
                </div>
                <p style={{ fontSize: 11, color: strengthColors[pwStrength], fontFamily: "'DM Sans'", fontWeight: 500 }}>
                  {strengthLabels[pwStrength]}
                </p>
              </div>
            )}

            {/* Requirements */}
            <div style={{ display: 'flex', flexDirection: 'column', gap: 6 }}>
              {[
                ['At least 8 characters', password.length >= 8],
                ['Contains a number', /\d/.test(password)],
                ['Contains a letter', /[a-zA-Z]/.test(password)],
              ].map(([label, met]) => (
                <div key={label} style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                  <div style={{
                    width: 16, height: 16, borderRadius: 4,
                    background: met ? T.accent : T.bgInput,
                    border: `1.5px solid ${met ? T.accent : T.border}`,
                    display: 'flex', alignItems: 'center', justifyContent: 'center',
                    transition: 'all 0.2s',
                  }}>
                    {met && <IconCheck size={10} />}
                  </div>
                  <span style={{ fontSize: compact ? 11 : 12, color: met ? T.textSub : T.textMuted, fontFamily: "'DM Sans'" }}>{label}</span>
                </div>
              ))}
            </div>
          </>}

          <FButton onClick={handleNext} loading={loading} compact={compact}>
            {step === 1 ? 'Continue →' : 'Create Account'}
          </FButton>

          {step === 1 && <>
            <Divider label="or" />
            <GoogleBtn compact={compact} />
          </>}
        </div>
      </div>

      {/* Footer */}
      <div style={{ textAlign: 'center', paddingTop: 14 }}>
        <span style={{ fontFamily: "'DM Sans'", fontSize: compact ? 12 : 13, color: T.textSub }}>
          Already have an account?{' '}
          <button
            onClick={() => onNavigate('login')}
            style={{ background: 'none', border: 'none', color: T.accent, fontWeight: 600, cursor: 'pointer', fontSize: 'inherit' }}
          >
            Log in
          </button>
        </span>
      </div>
    </div>
  );
}

// ── SCREEN 3: User Info (post-registration) ────────────────────────────────────
function UserInfoScreen({ onNavigate, compact }) {
  const [avatarColor] = useState(T.accent);
  const [goalSelected, setGoalSelected] = useState('');
  const [fitnessLevel, setFitnessLevel] = useState('');
  const [heightVal, setHeightVal] = useState('175');
  const [weightVal, setWeightVal] = useState('70');
  const [loading, setLoading] = useState(false);

  const goals = [
    { id: 'lose', icon: '🔥', label: 'Lose Weight' },
    { id: 'build', icon: '💪', label: 'Build Muscle' },
    { id: 'endurance', icon: '🏃', label: 'Endurance' },
    { id: 'maintain', icon: '⚖️', label: 'Stay Fit' },
  ];

  const levels = ['Beginner', 'Intermediate', 'Advanced'];

  function handleFinish() {
    if (!goalSelected || !fitnessLevel) return;
    setLoading(true);
    setTimeout(() => { setLoading(false); onNavigate('login'); }, 1000);
  }

  const isValid = goalSelected && fitnessLevel;
  const gap = compact ? 18 : 24;

  return (
    <div style={{ height: '100%', background: T.bg, display: 'flex', flexDirection: 'column', overflowY: 'auto' }}>
      {/* Header band */}
      <div style={{
        padding: compact ? '20px 20px 24px' : '28px 24px 32px',
        background: `linear-gradient(160deg, ${T.bgCard} 0%, ${T.bg} 100%)`,
        borderBottom: `1px solid ${T.border}`,
        display: 'flex', flexDirection: 'column', alignItems: 'center', gap: compact ? 10 : 14,
      }}>
        {/* Avatar upload area */}
        <div style={{ position: 'relative' }}>
          <div style={{
            width: compact ? 72 : 88, height: compact ? 72 : 88,
            borderRadius: '50%',
            background: `linear-gradient(135deg, ${T.accent} 0%, oklch(0.62 0.22 50) 100%)`,
            display: 'flex', alignItems: 'center', justifyContent: 'center',
            border: `3px solid ${T.bg}`,
            boxShadow: `0 0 0 2px ${T.accent}40`,
          }}>
            <span style={{ fontFamily: "'Barlow Condensed'", fontSize: compact ? 28 : 34, fontWeight: 800, color: '#0d0d12', letterSpacing: '-0.02em' }}>AJ</span>
          </div>
          <button style={{
            position: 'absolute', bottom: 0, right: 0,
            width: compact ? 26 : 30, height: compact ? 26 : 30,
            borderRadius: '50%', background: T.bgInput, border: `2px solid ${T.bg}`,
            display: 'flex', alignItems: 'center', justifyContent: 'center',
            cursor: 'pointer', color: T.textSub,
          }}>
            <IconCamera size={compact ? 13 : 15} />
          </button>
        </div>

        <div style={{ textAlign: 'center' }}>
          <h1 style={{
            fontFamily: "'Barlow Condensed'", fontSize: compact ? 26 : 32, fontWeight: 900,
            textTransform: 'uppercase', letterSpacing: '-0.01em', color: T.textPrimary, lineHeight: 1.1,
          }}>
            Set Up Your Profile
          </h1>
          <p style={{ fontFamily: "'DM Sans'", fontSize: compact ? 12 : 13, color: T.textSub, marginTop: 4 }}>
            Personalise your experience
          </p>
        </div>
      </div>

      {/* Scrollable content */}
      <div style={{ flex: 1, padding: compact ? '18px 20px 20px' : '24px 24px 28px', display: 'flex', flexDirection: 'column', gap: gap }}>

        {/* Body measurements */}
        <div>
          <SectionLabel compact={compact}>Body Stats</SectionLabel>
          <div style={{ display: 'flex', gap: 10, marginTop: compact ? 8 : 10 }}>
            <MeasureInput label="Height" unit="cm" value={heightVal} onChange={setHeightVal} compact={compact} />
            <MeasureInput label="Weight" unit="kg" value={weightVal} onChange={setWeightVal} compact={compact} />
          </div>
        </div>

        {/* Fitness goal */}
        <div>
          <SectionLabel compact={compact}>Primary Goal</SectionLabel>
          <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 8, marginTop: compact ? 8 : 10 }}>
            {goals.map(g => (
              <GoalCard
                key={g.id}
                icon={g.icon}
                label={g.label}
                selected={goalSelected === g.id}
                onClick={() => setGoalSelected(g.id)}
                compact={compact}
              />
            ))}
          </div>
        </div>

        {/* Fitness level */}
        <div>
          <SectionLabel compact={compact}>Fitness Level</SectionLabel>
          <div style={{ display: 'flex', gap: 8, marginTop: compact ? 8 : 10 }}>
            {levels.map(l => (
              <button
                key={l}
                onClick={() => setFitnessLevel(l)}
                style={{
                  flex: 1, padding: compact ? '8px 4px' : '11px 4px',
                  borderRadius: 10,
                  border: `1.5px solid ${fitnessLevel === l ? T.accent : T.border}`,
                  background: fitnessLevel === l ? T.accentDim : T.bgInput,
                  color: fitnessLevel === l ? T.accent : T.textSub,
                  fontFamily: "'Barlow Condensed'",
                  fontSize: compact ? 13 : 15,
                  fontWeight: 700,
                  letterSpacing: '0.04em',
                  cursor: 'pointer',
                  transition: 'all 0.15s',
                }}
              >
                {l}
              </button>
            ))}
          </div>
        </div>

        {/* CTA */}
        <FButton onClick={handleFinish} disabled={!isValid} loading={loading} compact={compact}>
          Start Training
        </FButton>

        <button
          onClick={() => onNavigate('login')}
          style={{ background: 'none', border: 'none', color: T.textMuted, fontFamily: "'DM Sans'", fontSize: compact ? 12 : 13, cursor: 'pointer', textAlign: 'center', paddingBottom: 4 }}
        >
          Skip for now
        </button>
      </div>
    </div>
  );
}

function SectionLabel({ children, compact }) {
  return (
    <p style={{
      fontFamily: "'Barlow Condensed'", fontSize: compact ? 11 : 12, fontWeight: 700,
      letterSpacing: '0.1em', textTransform: 'uppercase', color: T.textSub,
    }}>
      {children}
    </p>
  );
}

function MeasureInput({ label, unit, value, onChange, compact }) {
  return (
    <div style={{ flex: 1, background: T.bgInput, border: `1.5px solid ${T.border}`, borderRadius: 10, padding: compact ? '10px 12px' : '12px 14px' }}>
      <p style={{ fontFamily: "'Barlow Condensed'", fontSize: 10, fontWeight: 600, letterSpacing: '0.1em', textTransform: 'uppercase', color: T.textMuted, marginBottom: 4 }}>{label}</p>
      <div style={{ display: 'flex', alignItems: 'baseline', gap: 4 }}>
        <input
          type="number"
          value={value}
          onChange={e => onChange(e.target.value)}
          style={{
            background: 'none', border: 'none', outline: 'none',
            fontFamily: "'Barlow Condensed'", fontSize: compact ? 22 : 26, fontWeight: 800,
            color: T.textPrimary, width: '60%',
          }}
        />
        <span style={{ fontFamily: "'DM Sans'", fontSize: compact ? 12 : 13, color: T.textSub }}>{unit}</span>
      </div>
    </div>
  );
}

function GoalCard({ icon, label, selected, onClick, compact }) {
  return (
    <button
      onClick={onClick}
      style={{
        padding: compact ? '12px 10px' : '16px 12px',
        borderRadius: 12,
        border: `1.5px solid ${selected ? T.accent : T.border}`,
        background: selected ? T.accentDim : T.bgInput,
        display: 'flex', flexDirection: 'column', alignItems: 'center', gap: compact ? 5 : 7,
        cursor: 'pointer', transition: 'all 0.15s',
        position: 'relative', overflow: 'hidden',
      }}
    >
      {selected && (
        <div style={{
          position: 'absolute', top: 7, right: 7,
          width: 16, height: 16, borderRadius: '50%',
          background: T.accent, display: 'flex', alignItems: 'center', justifyContent: 'center',
        }}>
          <IconCheck size={9} />
        </div>
      )}
      <span style={{ fontSize: compact ? 20 : 24 }}>{icon}</span>
      <span style={{
        fontFamily: "'Barlow Condensed'", fontSize: compact ? 13 : 14, fontWeight: 700,
        letterSpacing: '0.04em', textTransform: 'uppercase',
        color: selected ? T.accent : T.textSub,
      }}>{label}</span>
    </button>
  );
}

// ── Scaled Device Wrapper ──────────────────────────────────────────────────────
function ScaledDevice({ children }) {
  const ref = useRef(null);
  const [scale, setScale] = useState(1);

  useEffect(() => {
    function compute() {
      const vw = window.innerWidth;
      const vh = window.innerHeight;
      const deviceW = 390 + 16; // +16 for border
      const deviceH = 844 + 16;
      const s = Math.min((vw - 32) / deviceW, (vh - 32) / deviceH, 1);
      setScale(s);
    }
    compute();
    window.addEventListener('resize', compute);
    return () => window.removeEventListener('resize', compute);
  }, []);

  return (
    <div ref={ref} style={{ transform: `scale(${scale})`, transformOrigin: 'center center' }}>
      {children}
    </div>
  );
}

// ── Main App ───────────────────────────────────────────────────────────────────
function App() {
  const [tweaks, setTweak] = useTweaks(/*EDITMODE-BEGIN*/{
    "density": "comfortable"
  }/*EDITMODE-END*/);

  const compact = tweaks.density === 'compact';
  const [screen, setScreen] = useState('login');
  const [prevScreen, setPrevScreen] = useState(null);
  const [transitioning, setTransitioning] = useState(false);

  function navigate(to) {
    setTransitioning(true);
    setTimeout(() => {
      setPrevScreen(screen);
      setScreen(to);
      setTransitioning(false);
    }, 180);
  }

  const screenMap = {
    login: <LoginScreen onNavigate={navigate} compact={compact} />,
    register: <RegisterScreen onNavigate={navigate} compact={compact} />,
    'user-info': <UserInfoScreen onNavigate={navigate} compact={compact} />,
  };

  return (
    <>
      <style>{`
        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes slideIn { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: translateX(0); } }
        input::placeholder { color: #3a3a4a; }
        input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; }
        * { -webkit-tap-highlight-color: transparent; }
        ::-webkit-scrollbar { width: 0; }
      `}</style>

      <ScaledDevice>
        <AndroidDevice dark={true} width={390} height={844}>
          <div style={{
            width: '100%', height: '100%',
            opacity: transitioning ? 0 : 1,
            transform: transitioning ? 'translateX(8px)' : 'translateX(0)',
            transition: 'opacity 0.18s ease, transform 0.18s ease',
          }}>
            {screenMap[screen]}
          </div>
        </AndroidDevice>
      </ScaledDevice>

      <TweaksPanel>
        <TweakSection label="Density">
          <TweakRadio label="Density" value={tweaks.density} options={['compact', 'comfortable']} onChange={v => setTweak('density', v)} />
        </TweakSection>
        <TweakSection label="Screen">
          <TweakRadio label="Screen" value={screen} options={['login', 'register', 'profile']}
            onChange={v => navigate(v === 'profile' ? 'user-info' : v)}
          />
        </TweakSection>
      </TweaksPanel>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
